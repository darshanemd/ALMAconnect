<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu Portal - Interactive Hub</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #eaf8f7 0%, #ffffff 50%, #e0f2fe 100%);
      --primary-green: #72bf44;
      --primary-blue: #0072bc;
      --primary-teal: #00a896;
      --dark-blue: #1c2d42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Mock Browser Window Container */
    .browser-frame {
      width: 90vw;
      max-width: 1000px;
      height: 85vh;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.8);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Browser Bar */
    .browser-header {
      height: 40px;
      background: rgba(240, 243, 246, 0.8);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    /* Canvas Area */
    .viewport {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Interactive Logo Styling */
    .hub-container {
      position: relative;
      width: 450px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Rotating background swooshes */
    .swoosh-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotateRing 30s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Interactive Nodes */
    .hub-node {
      position: absolute;
      background: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      color: #333;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .hub-node::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .hub-node:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    /* Hub Positions */
    .node-student {
      top: 22%;
      right: 15%;
    }
    .node-student::before { background-color: var(--primary-green); }

    .node-alumni {
      bottom: 18%;
      left: 12%;
    }
    .node-alumni::before { background-color: var(--primary-blue); }

    .node-college {
      bottom: 18%;
      right: 12%;
    }
    .node-college::before { background-color: var(--primary-teal); }

    /* Login Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .login-card {
      transform: translateY(0);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #888;
    }

    .login-card h3 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-blue);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary-green);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      filter: brightness(0.95);
    }
  </style>
</head>
<body>

  <div class="browser-frame">
    <!-- Browser Top Bar -->
    <div class="browser-header">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>

    <!-- Main Viewport -->
    <div class="viewport">
      <div class="hub-container">
        
        <!-- Rotating SVG Graphic -->
        <svg class="swoosh-ring" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8cc63f" />
              <stop offset="100%" stop-color="#00a896" />
            </linearGradient>
            <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0072bc" />
              <stop offset="100%" stop-color="#29bae2" />
            </linearGradient>
            <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00a896" />
              <stop offset="100%" stop-color="#0072bc" />
            </linearGradient>
          </defs>

          <!-- Outer Dynamic Curved Blades -->
          <path d="M 250 80 A 170 170 0 0 1 400 330 C 330 310 270 250 250 80 Z" fill="url(#grad-green)" opacity="0.85"/>
          <path d="M 120 370 A 170 170 0 0 1 100 170 C 200 220 230 300 120 370 Z" fill="url(#grad-blue)" opacity="0.85"/>
          <path d="M 380 370 A 170 170 0 0 1 150 410 C 240 330 320 310 380 370 Z" fill="url(#grad-teal)" opacity="0.85"/>
          
          <!-- Outer Circle Nodes -->
          <circle cx="250" cy="70" r="22" fill="#72bf44" />
          <circle cx="90" cy="350" r="22" fill="#0072bc" />
          <circle cx="410" cy="350" r="22" fill="#00a896" />
        </svg>

        <!-- Static Center Graduation Cap SVG -->
        <svg style="position: absolute; width: 140px; height: 140px; z-index: 5;" viewBox="0 0 100 100">
          <path d="M 50 25 L 85 40 L 50 55 L 15 40 Z" fill="#1c2d42"/>
          <path d="M 28 47.5 V 62 C 28 68 72 68 72 62 V 47.5" fill="#1c2d42"/>
          <path d="M 75 42 V 65" stroke="#1c2d42" stroke-width="2.5"/>
          <polygon points="72,65 78,65 75,75" fill="#1c2d42"/>
        </svg>

        <!-- Interactive Text Badges -->
        <div class="hub-node node-student" onclick="openLogin('Student Hub')">Student Hub</div>
        <div class="hub-node node-alumni" onclick="openLogin('Alumni Portal')">Alumni</div>
        <div class="hub-node node-college" onclick="openLogin('College Portal')">College</div>

      </div>
    </div>

    <!-- Hidden Interactive Login Modal -->
    <div class="modal-overlay" id="loginModal">
      <div class="login-card">
        <button class="close-btn" onclick="closeLogin()">&times;</button>
        <h3 id="modalTitle">Portal Login</h3>
        <input type="text" class="input-field" placeholder="Username / Email" />
        <input type="password" class="input-field" placeholder="Password" />
        <button class="submit-btn" onclick="handleLogin()">Sign In</button>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('loginModal');
    const modalTitle = document.getElementById('modalTitle');

    function openLogin(portalName) {
      modalTitle.innerText = portalName + ' Login';
      modal.classList.add('active');
    }

    function closeLogin() {
      modal.classList.remove('active');
    }

    function handleLogin() {
      alert('Logging in...');
      closeLogin();
    }
  </script>
</body>
</html>
